[package]
name = "dayjot-desktop"
# Intentionally frozen: the app version lives in apps/desktop/package.json and
# tauri.conf.json points at it. The crate is never published, so its version
# has no consumer — freezing it keeps Cargo.lock out of every release diff.
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dayjot_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# `devtools` compiles the web inspector into release builds too (it is otherwise
# debug-only), so a shipped app stays debuggable — see `src/devtools.rs`.
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-opener = "2.5.4"
# Decodes `dayjot-asset://` request paths (`fs/asset_protocol.rs`); the same
# crate tauri itself uses for its protocol URLs.
percent-encoding = "2.3.2"
# `time` backs the bounded waits in `windows::close_note_windows` and
# `fullscreen`, whose exit signal rides a `sync` oneshot (tauri already runs
# on tokio; this only makes those primitives addressable).
tokio = { version = "1.52.3", features = ["time", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
# `hooks` adds the authorizer API used to lock the read-only `db_query` bridge
# down to pure reads (deny ATTACH/DETACH/PRAGMA); see `db/query.rs`.
rusqlite = { workspace = true, features = ["hooks"] }
dayjot-index-schema = { path = "../../../crates/index-schema" }
tempfile = { workspace = true }
sha2 = { workspace = true }
dirs = "6.0.0"
tauri-plugin-dialog = "2.7.1"
base64 = "0.22.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
keyring = { version = "3.6.3", features = ["apple-native"] }
# Git backup/sync primitives (Plan 12) + SSH transport for generic remotes
# (Plan 16 V1: agent auth only). Everything is vendored/static — libssh2 and
# openssl must never link against homebrew dylibs the distributed app won't
# have (libssh2-sys only consults pkg-config when LIBSSH2_SYS_USE_PKG_CONFIG
# is set, and vendored-openssl pins the rest).
git2 = { version = "0.21.0", default-features = false, features = [
  "https",
  "ssh",
  "vendored-libgit2",
  "vendored-openssl",
] }
tauri-plugin-http = "2.5.9"
# Link capture (Plan 11): screenshot downscale + the bounded meta-scrape fetch.
# reqwest 0.12 rides the exact version tauri-plugin-http already compiles.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }

xattr = "1.6.1"
# Apple Calendar read-only bridge (`src/calendar.rs`): EventKit through the
# objc2 bindings, trimmed to the classes the module touches. objc2-app-kit
# covers EKCalendar's NSColor → hex conversion plus the NSWindow fullscreen
# notification the ⌘W hide waits on (`src/fullscreen.rs`).
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSDate",
  "NSEnumerator",
  "NSError",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
  "block2",
] }
objc2-event-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "EKCalendar",
  "EKCalendarItem",
  "EKEvent",
  "EKEventStore",
  "EKObject",
  "EKParticipant",
  "EKSource",
  "EKTypes",
  "block2",
  "objc2-app-kit",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSColor",
  "NSColorSpace",
  "NSWindow",
] }

# Apple Contacts integration (`contacts.rs`): live CNContactStore lookups —
# never a mirrored copy of the address book. block2 bridges the
# requestAccessForEntityType completion handler back into blocking Rust.
# core-foundation backs the iCloud/backup sync-exclusion resource keys on
# `.dayjot/` and `.git/` (`fs/io.rs`). dispatch2 supplies MainThreadBound,
# keeping the iCloud metadata query's non-Send Objective-C handles pinned to
# the main thread (`icloud/watch.rs`).
core-foundation = "0.10.1"
dispatch2 = "0.3.1"
objc2-contacts = "0.3.2"
# Auto-update, window-state restore, the file watcher, OS-trash deletes, deep
# links, and the single-instance guard.
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-window-state = "2.4.1"
trash = "5.2.6"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }

[dev-dependencies]
tauri = { version = "2.11.2", features = ["test"] }
